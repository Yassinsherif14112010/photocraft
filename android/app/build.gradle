apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

import com.facebook.react.defaults.DefaultNewArchitectureSettings
import com.facebook.react.defaults.DefaultPreconditionUtil

react {
    autolinkLibrariesWithApp()
}

def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a", "x86_64"]
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.photocraft.mobile"
    defaultConfig {
        applicationId "com.photocraft.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        buildFeatures {
            buildConfig = true
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DPHOTOCRAFT_JNILIBS=${projectDir}/src/main/jniLibs"
                abiFilters (*reactNativeArchitectures().toList())
            }
        }
    }

    // The Rust engine core is built by scripts/build-android.sh (cargo-ndk) and
    // dropped here as libphotocraft_android_ffi.so per ABI.
    sourceSets {
        main {
            jniLibs.srcDirs += ["src/main/jniLibs"]
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // React Native
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    debugImplementation("com.facebook.flipper:flipper:0.260.0")
    // Merged-So mapping support (OpenSourceMergedSoMapping in MainApplication).
    implementation("com.facebook.soloader:soloader:0.11.0")

    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.exifinterface:exifinterface:1.3.7")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
    // Required by the manifest theme (Theme.MaterialComponents.DayNight.*).
    implementation("com.google.android.material:material:1.12.0")

    // Local on-device AI: OCR (PaddleOCR det/rec) + Background Removal (BiRefNet Lite).
    // 100% offline ONNX Runtime — no cloud, no paid API.
    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.19.2")
}

// A keystore is generated by scripts/build-android.sh for debug builds.
