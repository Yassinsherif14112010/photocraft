# PhotoCraft for Android — build configuration.
# See docs/android.md for the full setup (Android SDK, NDK, Rust, cargo-ndk).

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

kotlin.code.style=official

# Rust / JNI build. Set -Pphotocraft.skipNative=true to build the app shell only (the Rust
# engine must then already be present in app/src/main/jniLibs; used by CI jobs that only
# compile Kotlin).
photocraft.skipNative=false
# ABIs the Rust engine is built for (all four are shipped in the release bundle).
photocraft.abis=arm64-v8a,armeabi-v7a,x86_64
photocraft.cargoProfile=release
