rootProject.name = 'PhotoCraftMobile'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Provides com.facebook.react:react-native-gradle-plugin for the root
// buildscript classpath (required: without it the React Gradle plugin does
// not resolve and every Gradle invocation fails at configuration time).
includeBuild('../node_modules/@react-native/gradle-plugin')

include ':app'
