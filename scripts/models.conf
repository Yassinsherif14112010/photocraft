# PhotoCraft — background-removal model manifest.
#
# THIS IS THE SINGLE SOURCE OF TRUTH for the models the Android app downloads and runs.
# scripts/fetch-models.sh / .ps1 / .bat read it on the development machine, and the app bundles the
# identical file as android/app/src/main/assets/models.conf (tools/check_models_conf.py fails if
# the two ever drift apart).
#
# Format (one model per line, '#' starts a comment, fields separated by '|'):
#
#   id | label | tier | input | file | bytes | sha256 | min_bytes | url | mirrors
#
#   id         short key used by the app: quick | balanced | hq
#   label      user-visible name
#   tier       quick | balanced | hq  (drives the default choice per device class)
#   input      model input size in px (square); the runtime also reads the real shape from the
#              ONNX session and prefers it when the model declares a static shape
#   file       destination file name inside the models directory
#   bytes      exact size in bytes, 0 if the distributor publishes none
#   sha256     lowercase hex checksum, '-' if the distributor publishes none
#   min_bytes  sanity floor: anything smaller is a truncated download or an HTML error page
#   url        primary download URL (https)
#   mirrors    ';'-separated fallback URLs, tried in order when the primary fails ('-' for none)
#
# Provenance and licences: scripts/models.LICENSES.md and ATTRIBUTION.md. Nothing here is invented:
# every URL, size and checksum is taken from the distributor.

# U²-Net-p — the classic rembg "quick" model: 4.7 MB, 320 px, well under a second on a mid-range
# phone. Apache-2.0 (xuebinqin/U-2-Net); the ONNX conversion is distributed by rembg (MIT).
# Checksum published on the model card: https://huggingface.co/skillsafe-ai/u2netp
u2netp|Quick (U²-Net-p)|quick|320|u2netp.onnx|0|309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8|4000000|https://huggingface.co/skillsafe-ai/u2netp/resolve/main/u2netp.onnx|https://huggingface.co/Heliosoph/u2net-onnx/resolve/main/u2netp.onnx

